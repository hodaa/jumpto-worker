name: Deploy Celery Worker

on:
  push:
    branches:
      - main
    
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5
      - name: Test SSH port
        run: |
          nc -vz -w 10 ${{ secrets.ORACLE_HOST }} 22
         
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/jumpto-worker
            export IMAGE_NAME=ghcr.io/${{ github.repository }}
            export APP_VERSION=${{ github.sha }}

            # 1. Remember currently running version
            CURRENT_IMAGE=$(docker inspect jumpto-worker --format '{{.Config.Image}}')
            PREVIOUS_VERSION="${CURRENT_IMAGE##*:}"

            echo "Previous version: $PREVIOUS_VERSION"
            echo "New version: $APP_VERSION"

            # 2. Deploy new version
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # 3. Health check
            sleep 10

            if ! ./health-check.sh; then
              echo "Deployment failed. Rolling back..."

              # 4. Rollback
              export APP_VERSION="$PREVIOUS_VERSION"

              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d

              exit 1
            fi

            echo "Deployment successful"