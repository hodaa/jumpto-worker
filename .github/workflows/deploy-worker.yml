name: Deploy Celery Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/jumpto
            git pull origin main
            docker stop jumpto-worker || true
            docker rm jumpto-worker || true
            docker build -t jumpto-worker .
            docker run -d \
              --name jumpto-worker \
              --restart unless-stopped \
              --env-file .env \
              jumpto-worker
              