  services:
    bgutil-pot:
      image: brainicism/bgutil-ytdlp-pot-provider
      container_name: bgutil-pot
      restart: unless-stopped
    worker:
      build: .
      container_name: jumpto-worker
      restart: unless-stopped
      env_file:
        - .env
      environment:
        # Point yt-dlp at the bgutil PO-token provider container (service DNS).
        YTDLP_BGUTIL_URL: http://bgutil-pot:4416
      volumes:
        # Host cookie file to mount: default /etc/jumpto/cookies.txt (VPS),
        # override with COOKIE_FILE for local dev where /etc/jumpto may not exist.
        - ${COOKIE_FILE:-/etc/jumpto/cookies.txt}:/etc/jumpto/cookies.txt:ro
        # Writable marker that requests a host-side cookie refresh.
        - /etc/jumpto/state:/var/lib/jumpto/state
      depends_on:
        - bgutil-pot
      command:
        - celery
        - -A
        - app.tasks.celery_app.celery_app
        - worker
        - --loglevel=info
        - --hostname=jumpto-worker  