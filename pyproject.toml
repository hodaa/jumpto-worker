[project]
name = "jumpto-worker"
version = "0.1.0"
description = "JumpTo Worker - Celery transcription service"
requires-python = ">=3.12"
dependencies = [
    "celery==5.4.0",
    "redis==5.2.1",
    "httpx==0.28.1",
    "pydantic==2.10.1",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.23.7",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
    "black==24.10.0",
    "ruff==0.8.0",
    "respx==0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 2

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "TID", "PTH", "PYI"]
ignore = ["E501", "B008"]
